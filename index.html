<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLPT N4/N5 Master - Đúng 150 Cấu Trúc Ngữ Pháp Chuẩn Đề Thi</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --panel-bg: #0f172a;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --error: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --font-mono: "Fira Code", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .quiz-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 760px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .category-badge {
      background: #0369a1;
      color: #e0f2fe;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .score-tracker {
      font-size: 0.9rem;
      color: var(--accent);
      font-weight: 600;
      font-family: var(--font-mono);
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.15s ease;
    }

    .question-section {
      margin-bottom: 24px;
    }

    .question-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .grammar-structure {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.4;
      color: #fff;
      background: var(--panel-bg);
      padding: 16px;
      border-radius: 8px;
      border-left: 5px solid var(--accent);
    }

    .example-preview {
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px dashed var(--border);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      line-height: 1.4;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: #1e293b;
    }

    .option-btn.correct {
      background: rgba(34, 197, 94, 0.15) !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: bold;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.15) !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .explanation-box {
      background: #0b1329;
      border: 1px solid #1e3a8a;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 20px;
      display: none;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .explanation-title {
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .footer-controls {
      display: flex;
      justify-content: flex-end;
    }

    .next-btn {
      background: var(--accent);
      color: #0b0f19;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
    }

    .next-btn:hover {
      background: var(--accent-hover);
    }

    .result-screen {
      text-align: center;
      display: none;
      padding: 20px 0;
    }

    .result-title {
      font-size: 1.8rem;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .result-score {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    .restart-btn {
      background: var(--accent);
      color: #0b0f19;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div id="quizBlock">
    <div class="header-bar">
      <span class="category-badge" id="categoryBadge">Nhóm cấu trúc</span>
      <span class="score-tracker" id="scoreTracker">Câu: 1/150</span>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="question-section">
      <div class="question-title">Cấu trúc / Cụm mẫu câu sau có ý nghĩa chuẩn xác là gì?</div>
      <div class="grammar-structure" id="grammarText">...</div>
      <div class="example-preview" id="exampleText">Ví dụ: ...</div>
    </div>

    <div class="options-grid" id="optionsGrid"></div>

    <div class="explanation-box" id="explanationBox">
      <div class="explanation-title">💡 Giải thích logic & Vị trí bài thi:</div>
      <div id="explanationText">...</div>
    </div>

    <div class="footer-controls">
      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Câu Tiếp Theo →</button>
    </div>
  </div>

  <div class="result-screen" id="resultBlock">
    <h2 class="result-title">Hoàn Thành Toàn Bộ 150 Cấu Trúc!</h2>
    <p class="result-score" id="finalScoreText"></p>
    <button class="restart-btn" onclick="restartQuiz()">Luyện Lại Từ Đầu</button>
  </div>
</div>

<script>
const quizData = [
  // 1-10: NGHI VẤN TỪ & MẪU CÂU HỎI (N5-N4)
  {
    category: "Từ Nghi Vấn (Cách Thức)",
    grammar: "どうやって (Ví dụ: 大学までどうやって行きますか)",
    example: "VD: 市役所までどうやって行きますか。",
    options: [
      "Tại sao lại đến ủy ban?",
      "ĐI BẰNG CÁCH NÀO / BẰNG PHƯƠNG TIỆN GÌ? (hỏi trình tự, lộ trình)",
      "Mất bao nhiêu tiền để đến ủy ban?",
      "Ủy ban mở cửa lúc mấy giờ?"
    ],
    correct: 1,
    explain: "Minna Bài 16: どうやって = Hỏi về cách làm, phương tiện hoặc quy trình thực hiện cụ thể."
  },
  {
    category: "Từ Nghi Vấn (Tính Chất)",
    grammar: "どんな ＋ Danh từ (Ví dụ: どんな人 / どんな仕事)",
    example: "VD: 富士山はどんな山ですか。",
    options: [
      "Núi Phú Sĩ cao bao nhiêu mét?",
      "Là ngọn núi NHƯ THẾ NÀO? (hỏi tính chất, đặc điểm)",
      "Núi Phú Sĩ nằm ở tỉnh nào?",
      "Leo núi Phú Sĩ bằng cách nào?"
    ],
    correct: 1,
    explain: "Minna Bài 8: どんな + N = Hỏi về chủng loại, đặc tính, hình dáng của danh từ."
  },
  {
    category: "Từ Nghi Vấn (Cảm Nhận)",
    grammar: "どう (Ví dụ: 日本の生活はどうですか)",
    example: "VD: 新しい仕事はどうですか。",
    options: [
      "Công việc mới THẾ NÀO? (hỏi cảm nhận, đánh giá tổng quát)",
      "Tại sao lại nhận công việc mới?",
      "Làm công việc mới từ khi nào?",
      "Làm công việc mới cùng ai?"
    ],
    correct: 0,
    explain: "Minna Bài 8: どうですか = Thăm dò cảm xúc, trải nghiệm hoặc ấn tượng."
  },
  {
    category: "Từ Nghi Vấn (Nguyên Nhân)",
    grammar: "どうして / なぜ (Ví dụ: どうして遅刻したんですか)",
    example: "VD: どうして昨日会社を休んだんですか。",
    options: [
      "Nghỉ làm bằng cách nào?",
      "TẠI SAO / VÌ SAO lại nghỉ làm? (hỏi nguyên nhân)",
      "Nghỉ làm trong bao nhiêu ngày?",
      "Ai cho phép bạn nghỉ làm?"
    ],
    correct: 1,
    explain: "Minna Bài 9 & 26: どうして / なぜ = Hỏi nguyên nhân, vế trả lời thường kèm 〜から / 〜んです."
  },
  {
    category: "Từ Nghi Vấn (Thời Gian / Lượng)",
    grammar: "どのくらい / どれくらい (Ví dụ: どのくらいかかりますか)",
    example: "VD: ここから駅まで歩いてどのくらいかかりますか。",
    options: [
      "Đi ra ga bằng con đường nào?",
      "MẤT KHOẢNG BAO LÂU / BAO NHIÊU? (ước lượng thời gian, chi phí)",
      "Ai sẽ đi bộ ra nhà ga?",
      "Nhà ga mở cửa lúc mấy giờ?"
    ],
    correct: 1,
    explain: "Minna Bài 11: どのくらい = Ước lượng khoảng thời gian hoặc số lượng/chi phí."
  },
  {
    category: "Từ Nghi Vấn (Lựa Chọn)",
    grammar: "どの ＋ Danh từ (Ví dụ: どの傘ですか)",
    example: "VD: 田中さんのロッカーはどのロッカーですか。",
    options: [
      "Tủ đồ này giá bao nhiêu?",
      "Tủ đồ của Tanaka là CÁI TỦ NÀO? (lựa chọn trong 3 cái trở lên)",
      "Tủ đồ mở bằng cách nào?",
      "Tủ đồ màu sắc ra sao?"
    ],
    correct: 1,
    explain: "Minna Bài 16: どの + N = Xác định 1 đối tượng cụ thể trong nhóm nhiều đồ vật."
  },
  {
    category: "Từ Nghi Vấn (So Sánh 2)",
    grammar: "どちら / どっち (Ví dụ: 紅茶とコーヒー、どちらがいいですか)",
    example: "VD: 日本とベトナムと、どちらが暑いですか。",
    options: [

      "Hai nước nóng vào tháng mấy?",
      "Hai nước nóng như thế nào?"
    ],
    correct: 1,
    explain: "Minna Bài 12: どちら (lịch sự) / どっち (thân mật) = So sánh giữa 2 đối tượng."
  },
  {
    category: "Từ Nghi Vấn (Thời Điểm)",
    grammar: "いつ (Ví dụ: いつ日本へ来ましたか)",
    example: "VD: 次の試験はいつですか。",
    options: [
      "Kỳ thi tiếp theo diễn ra ở đâu?",
      "KHI NÀO / BAO GIỜ có kỳ thi tiếp theo?",
      "Kỳ thi tiếp theo có khó không?",
      "Ai sẽ tham gia kỳ thi tiếp theo?"
    ],
    correct: 1,
    explain: "Minna Bài 5: いつ = Từ để hỏi thời điểm chung (không cần trợ từ に đi kèm)."

  {
    category: "Từ Nghi Vấn (Nhân Vật)",
    grammar: "だれ / どなた (Ví dụ: あの人はどなたですか)",
    example: "VD: 会議室にいるのはだれですか。",
    options: [
      "Trong phòng họp có cái gì?",
      "AI / VỊ NÀO đang ở trong phòng họp?",
      "Phòng họp nằm ở tầng mấy?",
      "Phòng họp dùng để làm gì?"
    ],
    correct: 1,
    explain: "Minna Bài 1: だれ / どなた (kính ngữ) = Hỏi về danh tính con người."
  },
  {
    category: "Từ Nghi Vấn (Vật / Việc)",
    grammar: "何 (なに / なん) (Ví dụ: 何をしていますか)",
    example: "VD: 朝ご飯に何を食べましたか。",
    options: [
      "Bạn ăn sáng ở đâu?",

      "Bạn ăn sáng lúc mấy giờ?"
    ],
    correct: 1,
    explain: "Minna Bài 1 & 6: 何 = Hỏi về sự vật, nội dung hành động."
  },

  // 11-20: CÂU HỎI LỒNG & ĐIỀU KIỆN (NẾU... THÌ)
  {
    category: "Câu Hỏi Lồng",
    grammar: "〜かどうか (Ví dụ: 行くかどうか分かりません)",
    example: "VD: 明日雨が降るかどうか、分かりません。",
    options: [
      "Vì ngày mai trời mưa nên tôi không đi",
      "CÓ... HAY KHÔNG (lồng câu hỏi không có từ để hỏi)",
      "Nếu ngày mai trời mưa thì hãy báo tôi",
      "Sau khi mưa tạnh thì tôi mới đi"
    ],
    correct: 1,
    explain: "Minna Bài 40: Thể thông thường + かどうか = Lồng câu hỏi Yes/No thành mệnh đề phụ."
  },
  {
    category: "Câu Hỏi Lồng",
    grammar: "Từ nghi vấn ＋ か (Ví dụ: どこにあるか知っていますか)",
    example: "VD: 鍵をどこに置いたか、忘れました。",
    options: [
      "Tôi đã quên mất chìa khóa ĐÃ ĐẶT Ở ĐÂU",
      "Tôi không có chìa khóa nào ở đây",
      "Hãy đặt chìa khóa ở bất cứ đâu",
      "Tôi vừa tìm thấy chìa khóa"
    ],
    correct: 0,
    explain: "Minna Bài 40: [Từ để hỏi] + thể ngắn + か = Lồng câu hỏi có từ nghi vấn vào câu chính."
  },
  {
    category: "Điều Kiện Đa Năng",
    grammar: "〜たら (Ví dụ: 安かったら買います / 駅に着いたら電話して)",
    example: "VD: 時間があったら、映画を見に行きましょう。",
    options: [
      "Hễ có thời gian là mắt lại mỏi",
      "NẾU... THÌ / SAU KHI XONG A THÌ LÀM B (điều kiện linh hoạt nhất)",
      "Mặc dù có thời gian nhưng không đi",
      "Bắt buộc phải có thời gian"
    ],
    correct: 1,
    explain: "Minna Bài 25: V-たら = Dùng cho cả giả định 'Nếu' lẫn trình tự thời gian 'Sau khi'."
  },
  {
    category: "Điều Kiện Logic",
    grammar: "〜ば (Ví dụ: 安ければ買います)",
    example: "VD: 練習すれば、上手になりますよ。",
    options: [
      "Sau khi giỏi rồi thì mới luyện tập",
      "NẾU... THÌ (điều kiện cần thiết về mặt logic để dẫn tới kết quả)",
      "Vì luyện tập nên bị mệt",
      "Không cần luyện tập cũng giỏi"
    ],
    correct: 1,
    explain: "Minna Bài 35: V-ば / A-ければ = Thiết lập tiền đề logic (Có A thì mới có B)."
  },
  {
    category: "Điều Kiện Lời Khuyên",

    example: "VD: カメラを買うなら、あの店がいいですよ。",
    options: [
      "Sau khi mua máy ảnh xong thì ghé quán đó",
      "NẾU LÀ... / NẾU CÓ Ý ĐỊNH ĐÓ THÌ... (tiếp nhận chủ đề để đưa lời khuyên)",
      "Hễ cứ vào quán là mua máy ảnh",
      "Cấm không được mua máy ảnh ở đó"
    ],
    correct: 1,
    explain: "Minna Bài 35: N / V-nguyên mẫu + なら = Đưa ra giải pháp tối ưu cho chủ đề đối phương vừa nêu."
  },
  {
    category: "Điều Kiện Tất Yếu",
    grammar: "〜と (Ví dụ: ボタンを押すと、水が出ます)",
    example: "VD: この道をまっすぐ行くと、駅があります。",
    options: [
      "Nếu đi thẳng thì hãy ghé nhà ga nhé",
      "HỄ CỨ... LÀ TẤT YẾU XẢY RA (quy luật tự nhiên, máy móc, chỉ đường 100%)",

      "Định đi thẳng nhưng đường bị chặn"

    correct: 1,
    explain: "Minna Bài 23: V-ru + と = Quy luật tất yếu, chỉ đường, thao tác máy. Vế sau không chứa ý chí/mệnh lệnh."
  },
  {
    category: "Mặc Dù / Bất Chấp",
    grammar: "〜ても / 〜でも (Ví dụ: 雨が降っても行きます)",

    correct: 1,
    explain: "Minna Bài 25: V-ても / A-くても = Cho dù có điều kiện đó đi nữa thì hành động vẫn tiếp tục."

    example: "VD: 日本料理はおいしいけど、高いです。",
    options: [
      "NHƯNG / TUY NHIÊN (nối 2 vế tương phản hoặc mở đầu câu nhẹ nhàng)",
      "Vì món Nhật ngon nên tôi ăn",
      "Nếu món Nhật ngon thì hãy mua",
      "Món Nhật vừa rẻ vừa dở"

    correct: 0,

  {
    category: "Nhưng (Văn Lịch Sự)",

    options: [
      "NHƯNG / MỞ ĐẦU LỊCH SỰ (dùng trong văn viết hoặc giao tiếp trang trọng)",

let currentIndex = 0;
let score = 0;
let answered = false;

// DOM Elements
const categoryBadge = document.getElementById('categoryBadge');
const scoreTracker = document.getElementById('scoreTracker');
const progressBar = document.getElementById('progressBar');
const grammarText = document.getElementById('grammarText');
const exampleText = document.getElementById('exampleText');
const optionsGrid = document.getElementById('optionsGrid');
const explanationBox = document.getElementById('explanationBox');
const explanationText = document.getElementById('explanationText');
const nextBtn = document.getElementById('nextBtn');
const quizBlock = document.getElementById('quizBlock');
const resultBlock = document.getElementById('resultBlock');
const finalScoreText = document.getElementById('finalScoreText');

function loadQuestion() {
  answered = false;
  const q = quizData[currentIndex];

  categoryBadge.textContent = q.category;
  scoreTracker.textContent = `Câu: ${currentIndex + 1}/${quizData.length}`;
  progressBar.style.width = `${((currentIndex) / quizData.length) * 100}%`;

  grammarText.textContent = q.grammar;
  exampleText.textContent = q.example;

  optionsGrid.innerHTML = '';
  explanationBox.style.display = 'none';
  nextBtn.style.display = 'none';

  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}. ${opt}</span>`;
    btn.onclick = () => selectOption(idx);
    optionsGrid.appendChild(btn);
  });
}

function selectOption(selectedIdx) {
  if (answered) return;
  answered = true;

  const q = quizData[currentIndex];
  const buttons = optionsGrid.querySelectorAll('.option-btn');

  buttons.forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.correct) {
      b.classList.add('correct');
    }
  });

  if (selectedIdx === q.correct) {
    score++;
  } else {
    buttons[selectedIdx].classList.add('wrong');
  }

  explanationText.textContent = q.explain;
  explanationBox.style.display = 'block';
  nextBtn.style.display = 'inline-block';
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < quizData.length) {
    loadQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  progressBar.style.width = '100%';
  quizBlock.style.display = 'none';
  resultBlock.style.display = 'block';

  const percentage = Math.round((score / quizData.length) * 100);
  finalScoreText.innerHTML = `Bạn đạt <strong>${score}/${quizData.length}</strong> cấu trúc (${percentage}%)!<br><br>` +
    (percentage >= 90 ? "🔥 Quá xuất sắc! Bạn đã làm chủ trọn vẹn toàn bộ 150 cấu trúc N4 - N5 và Minna no Nihongo." :
     percentage >= 75 ? "👍 Rất vững! Hãy xem lại các câu bị sai ở nhóm Kính ngữ và Trợ từ giới hạn." :
     "⚠️ Hãy luyện tập lại một lượt nữa để biến 150 cấu trúc này thành phản xạ vô điều kiện!");
}

function restartQuiz() {
  currentIndex = 0;
  score = 0;
  resultBlock.style.display = 'none';
  quizBlock.style.display = 'block';
  loadQuestion();
}

loadQuestion();
</script>
